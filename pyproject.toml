[project]
name = "job-lisakovsk-bot"
version = "0.1.0"
description = "Telegram bot for anonymous job seekers and employers in Lisakovsk"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.6,<4.0",
    "supabase>=2.4,<3.0",
    "pydantic-settings>=2.2,<3.0",
    "apscheduler>=3.10,<4.0",
    "aiohttp>=3.9,<4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
]

[project.scripts]
job-lisakovsk-bot = "job_lisakovsk_bot.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
